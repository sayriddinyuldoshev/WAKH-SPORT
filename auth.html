
<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAKH SPORT — Akkaunt</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;
background:#08111f;color:#f4f7fb;font-family:Arial,sans-serif;padding:18px}
.card{width:100%;max-width:420px;background:#111e30;border:1px solid #263b55;
border-radius:20px;padding:25px;box-shadow:0 16px 45px #0006}
h1{margin:0 0 8px;color:#65e0a3}
p{color:#b7c6d9;line-height:1.5}
input,button{width:100%;padding:13px;margin-top:12px;border-radius:10px;
font-size:16px}
input{background:#08111f;border:1px solid #344b65;color:white}
button{border:0;background:#65e0a3;color:#07150f;font-weight:bold}
.secondary{background:#263b55;color:white}
#message{overflow-wrap:anywhere}
#playerId{font-size:20px;color:#65e0a3;font-weight:bold}
</style>
</head>
<body>
<main class="card">
<h1>WAKH SPORT</h1>
<p>O‘yinchi akkaunti — email, parol va avtomatik ID.</p>

<div id="auth">
<input id="name" placeholder="Ismingiz" autocomplete="name">
<input id="email" type="email" placeholder="Email manzilingiz"
autocomplete="email">
<input id="password" type="password" placeholder="Parol (kamida 6 belgi)"
autocomplete="new-password">
<button id="register">Ro‘yxatdan o‘tish</button>
<button id="login" class="secondary">Akkauntga kirish</button>
<p id="message" role="status"></p>
</div>

<div id="profile" hidden>
<h2>Akkauntingiz</h2>
<p>O‘yinchi ID raqamingiz:</p>
<div id="playerId"></div>
<p id="playerEmail"></p>
<p id="playerStatus"></p>
<button id="logout" class="secondary">Chiqish</button>
</div>
</main>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBZ2pF_9PTtF2puakw612OtCvo1Ut-DLYs",
  authDomain: "wakh-sport.firebaseapp.com",
  projectId: "wakh-sport",
  storageBucket: "wakh-sport.firebasestorage.app",
  messagingSenderId: "18163044390",
  appId: "1:63044390:web:9bcb4ffdf3faddab93d6e7",
  measurementId: "G-1MDTSRRJQ4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const message = text => $("message").textContent = text;

$("register").onclick = async () => {
  const name = $("name").value.trim();
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!name) return message("Ismingizni kiriting.");
  if (password.length < 6) return message("Parol kamida 6 belgidan iborat bo‘lsin.");

  try {
    message("Akkaunt yaratilmoqda...");
    const result = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(result.user, { displayName: name });

    const playerId = "WKH-" + result.user.uid.slice(0, 8).toUpperCase();

    await setDoc(doc(db, "players", result.user.uid), {
      playerId,
      name,
      email,
      role: "player",
      status: "pending",
      createdAt: serverTimestamp()
    });

    message("Ro‘yxatdan o‘tish muvaffaqiyatli!");
  } catch (error) {
    message(error.code === "auth/email-already-in-use"
      ? "Bu email oldin ro‘yxatdan o‘tgan."
      : error.code === "auth/weak-password"
      ? "Kuchliroq parol tanlang."
      : "Xatolik: " + error.message);
  }
};

$("login").onclick = async () => {
  try {
    await signInWithEmailAndPassword(
      auth, $("email").value.trim(), $("password").value
    );
    message("Kirish muvaffaqiyatli.");
  } catch (error) {
    message("Kirish amalga oshmadi. Email va parolni tekshiring.");
  }
};

onAuthStateChanged(auth, async user => {
  $("auth").hidden = !!user;
  $("profile").hidden = !user;
  if (!user) return;

  $("playerEmail").textContent = user.email || "";
  try {
    const snap = await getDoc(doc(db, "players", user.uid));
    if (!snap.exists()) {
      $("playerId").textContent = "Profil topilmadi";
      $("playerStatus").textContent = "Administrator bilan bog‘laning.";
      return;
    }
    
let data;

if (!snap.exists()) {
  data = {
    playerId: "WKH-" + user.uid.slice(0, 8).toUpperCase(),
    name: user.displayName || "O‘yinchi",
    email: user.email,
    role: "player",
    status: "pending"
  };

  await setDoc(doc(db, "players", user.uid), {
    ...data,
    createdAt: serverTimestamp()
  });
} else {
  data = snap.data();
}
    $("playerStatus").textContent =
      "Firebase Firestore sozlamalarini tekshiring.";
  }
});

$("logout").onclick = () => signOut(auth);
</script>
</body>
</html>
